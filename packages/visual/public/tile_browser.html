<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>JYQXZ Smap 瓦片浏览器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'PingFang SC', monospace; }

#toolbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: #16213e; padding: 10px 20px;
  display: flex; align-items: center; gap: 15px; flex-wrap: wrap;
  border-bottom: 1px solid #0f3460;
}
#toolbar h1 { font-size: 16px; color: #fbbf24; white-space: nowrap; }

.filter-group { display: flex; align-items: center; gap: 5px; }
.filter-group label { font-size: 12px; color: #94a3b8; }
.filter-group select, .filter-group input {
  background: #0f3460; color: #e0e0e0; border: 1px solid #1e3a5f;
  padding: 4px 8px; border-radius: 4px; font-size: 12px;
}
.filter-group input { width: 80px; }

#stats { font-size: 11px; color: #64748b; margin-left: auto; }

#selected-info {
  position: fixed; top: 50px; left: 0; right: 0; z-index: 99;
  background: #1e293b; padding: 8px 20px; font-size: 13px;
  display: none; border-bottom: 1px solid #334155;
}
#selected-info .sel-grid {
  display: flex; gap: 15px; align-items: center; flex-wrap: wrap;
}
#selected-info .sel-item {
  display: flex; align-items: center; gap: 4px;
  background: #0f3460; padding: 3px 8px; border-radius: 4px;
  cursor: pointer; font-size: 12px;
}
#selected-info .sel-item:hover { background: #e74c3c; }
#selected-info .sel-item img { image-rendering: pixelated; }
#copy-btn {
  background: #22c55e; color: #fff; border: none; padding: 4px 12px;
  border-radius: 4px; cursor: pointer; font-size: 12px;
}
#copy-btn:hover { background: #16a34a; }
#clear-sel {
  background: #64748b; color: #fff; border: none; padding: 4px 12px;
  border-radius: 4px; cursor: pointer; font-size: 12px;
}

#grid-container {
  margin-top: 90px; padding: 10px;
  display: flex; flex-wrap: wrap; gap: 2px;
  justify-content: center;
}

.tile-cell {
  width: 56px; height: 56px; position: relative;
  display: flex; align-items: center; justify-content: center;
  background: #16213e; border: 1px solid #1e293b;
  cursor: pointer; transition: border-color 0.15s;
}
.tile-cell:hover { border-color: #fbbf24; z-index: 1; }
.tile-cell.selected { border-color: #22c55e; background: #0a2e1a; }
.tile-cell img {
  image-rendering: pixelated;
  max-width: 50px; max-height: 50px;
}
.tile-cell .tile-id {
  position: absolute; bottom: 0; left: 0; right: 0;
  font-size: 8px; text-align: center; color: #64748b;
  background: rgba(0,0,0,0.6); line-height: 1;
  padding: 1px;
}

/* Preview panel */
#preview {
  position: fixed; right: 10px; top: 90px; width: 220px;
  background: #16213e; border: 1px solid #0f3460; border-radius: 8px;
  padding: 12px; display: none; z-index: 50;
}
#preview img {
  image-rendering: pixelated;
  display: block; margin: 0 auto 8px;
  max-width: 180px; max-height: 180px;
  background: repeating-conic-gradient(#2a2a3e 0% 25%, #1a1a2e 0% 50%) 0 0 / 16px 16px;
}
#preview .pv-info { font-size: 11px; color: #94a3b8; line-height: 1.6; }
#preview .pv-info span { color: #fbbf24; }

/* Loading */
#loading {
  position: fixed; inset: 0; z-index: 200;
  background: #1a1a2e; display: flex;
  align-items: center; justify-content: center;
  font-size: 18px; color: #fbbf24;
}
#loading.hidden { display: none; }
</style>
</head>
<body>

<div id="loading">加载瓦片数据中...</div>

<div id="toolbar">
  <h1>Smap 瓦片浏览器</h1>
  <div class="filter-group">
    <label>高度范围:</label>
    <select id="heightFilter">
      <option value="all">全部</option>
      <option value="floor">地面 (h≤18)</option>
      <option value="low">低矮 (18&lt;h≤25)</option>
      <option value="mid">中等 (25&lt;h≤40)</option>
      <option value="tall">高大 (40&lt;h≤80)</option>
      <option value="v_tall">极高 (h&gt;80)</option>
    </select>
  </div>
  <div class="filter-group">
    <label>ID ≥</label>
    <input type="number" id="idMin" value="0" min="0">
    <label>ID ≤</label>
    <input type="number" id="idMax" value="4643" min="0">
  </div>
  <div class="filter-group">
    <label>搜索:</label>
    <input type="text" id="searchId" placeholder="输入ID (空格分隔)" style="width:150px">
  </div>
  <div class="filter-group">
    <label>尺寸:</label>
    <select id="cellSize">
      <option value="40">小</option>
      <option value="56" selected>中</option>
      <option value="80">大</option>
      <option value="120">超大</option>
    </select>
  </div>
  <span id="stats">-</span>
</div>

<div id="selected-info">
  <div class="sel-grid">
    <span style="color:#22c55e">已选:</span>
    <div id="sel-items"></div>
    <button id="copy-btn" onclick="copySelected()">复制 ID 列表</button>
    <button id="clear-sel" onclick="clearSelection()">清空</button>
    <span id="sel-count" style="color:#94a3b8">0 个</span>
  </div>
</div>

<div id="preview">
  <img id="pv-img" src="" alt="">
  <div class="pv-info" id="pv-info"></div>
</div>

<div id="grid-container"></div>

<script>
let tileData = [];
let selectedIds = new Set();

async function init() {
  const resp = await fetch('assets/jy-runtime/10_smap/_info.json');
  const info = await resp.json();

  tileData = info.map(t => ({
    idx: t.idx,
    w: t.w,
    h: t.h,
    xoff: t.xoff,
    yoff: t.yoff,
    url: `assets/jy-runtime/10_smap/${String(t.idx).padStart(4, '0')}.png`
  }));

  document.getElementById('loading').classList.add('hidden');
  renderGrid();
  bindEvents();
}

function getFilteredTiles() {
  const hf = document.getElementById('heightFilter').value;
  const idMin = parseInt(document.getElementById('idMin').value) || 0;
  const idMax = parseInt(document.getElementById('idMax').value) || 4643;
  const search = document.getElementById('searchId').value.trim();

  let tiles = tileData;

  // Search by specific IDs takes priority
  if (search) {
    const ids = search.split(/[\s,]+/).map(Number).filter(n => !isNaN(n));
    if (ids.length > 0) {
      const idSet = new Set(ids);
      tiles = tiles.filter(t => idSet.has(t.idx));
      return tiles;
    }
  }

  // Height filter
  if (hf === 'floor') tiles = tiles.filter(t => t.h <= 18);
  else if (hf === 'low') tiles = tiles.filter(t => t.h > 18 && t.h <= 25);
  else if (hf === 'mid') tiles = tiles.filter(t => t.h > 25 && t.h <= 40);
  else if (hf === 'tall') tiles = tiles.filter(t => t.h > 40 && t.h <= 80);
  else if (hf === 'v_tall') tiles = tiles.filter(t => t.h > 80);

  // ID range
  tiles = tiles.filter(t => t.idx >= idMin && t.idx <= idMax);

  return tiles;
}

function renderGrid() {
  const container = document.getElementById('grid-container');
  const cellSize = parseInt(document.getElementById('cellSize').value);
  const tiles = getFilteredTiles();

  document.getElementById('stats').textContent = `显示 ${tiles.length} / ${tileData.length} 个瓦片`;

  // Limit rendering for performance
  const MAX = 2000;
  const renderTiles = tiles.slice(0, MAX);

  let html = '';
  for (const t of renderTiles) {
    const sel = selectedIds.has(t.idx) ? ' selected' : '';
    html += `<div class="tile-cell${sel}" data-idx="${t.idx}" style="width:${cellSize}px;height:${cellSize}px">
      <img src="${t.url}" loading="lazy" style="max-width:${cellSize-6}px;max-height:${cellSize-6}px">
      <span class="tile-id">${t.idx}</span>
    </div>`;
  }
  if (tiles.length > MAX) {
    html += `<div style="width:100%;text-align:center;padding:20px;color:#64748b">
      还有 ${tiles.length - MAX} 个瓦片未显示，请缩小范围
    </div>`;
  }
  container.innerHTML = html;
}

function bindEvents() {
  // Filter changes
  ['heightFilter', 'idMin', 'idMax', 'searchId', 'cellSize'].forEach(id => {
    document.getElementById(id).addEventListener('input', debounce(renderGrid, 300));
  });

  // Tile click
  document.getElementById('grid-container').addEventListener('click', e => {
    const cell = e.target.closest('.tile-cell');
    if (!cell) return;

    const idx = parseInt(cell.dataset.idx);
    const t = tileData.find(t => t.idx === idx);
    if (!t) return;

    // Toggle selection on Ctrl/Cmd click
    if (e.ctrlKey || e.metaKey) {
      if (selectedIds.has(idx)) {
        selectedIds.delete(idx);
        cell.classList.remove('selected');
      } else {
        selectedIds.add(idx);
        cell.classList.add('selected');
      }
      updateSelectionBar();
      return;
    }

    // Normal click = preview
    showPreview(t, cell);
  });

  // Keyboard: Escape to close preview
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.getElementById('preview').style.display = 'none';
    }
  });
}

function showPreview(t, cell) {
  const pv = document.getElementById('preview');
  const img = document.getElementById('pv-img');
  const info = document.getElementById('pv-info');

  img.src = t.url;
  info.innerHTML = `
    ID: <span>${t.idx}</span><br>
    尺寸: <span>${t.w} x ${t.h}</span><br>
    偏移: <span>xoff=${t.xoff} yoff=${t.yoff}</span><br>
    <span style="color:#64748b">Ctrl+点击 选中/取消</span>
  `;
  pv.style.display = 'block';
}

function updateSelectionBar() {
  const bar = document.getElementById('selected-info');
  const items = document.getElementById('sel-items');
  const count = document.getElementById('sel-count');

  if (selectedIds.size === 0) {
    bar.style.display = 'none';
    return;
  }

  bar.style.display = 'block';
  count.textContent = `${selectedIds.size} 个`;

  let html = '';
  for (const idx of selectedIds) {
    const t = tileData.find(t => t.idx === idx);
    const url = t ? t.url : '';
    html += `<div class="sel-item" onclick="removeSel(${idx})" title="点击移除">
      <img src="${url}" width="16" height="16"> ${idx}
    </div>`;
  }
  items.innerHTML = html;
}

function removeSel(idx) {
  selectedIds.delete(idx);
  const cell = document.querySelector(`.tile-cell[data-idx="${idx}"]`);
  if (cell) cell.classList.remove('selected');
  updateSelectionBar();
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.tile-cell.selected').forEach(c => c.classList.remove('selected'));
  updateSelectionBar();
}

function copySelected() {
  const ids = Array.from(selectedIds).sort((a, b) => a - b);
  const text = ids.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '已复制!';
    setTimeout(() => btn.textContent = '复制 ID 列表', 1500);
  });
}

function debounce(fn, ms) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

init();
</script>
</body>
</html>
