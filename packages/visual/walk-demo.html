<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSolo - 角色行走演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #e0e0e0;
    overflow: hidden;
  }
  h1 {
    font-size: 18px;
    color: #f0c040;
    margin-bottom: 8px;
    text-shadow: 0 0 10px rgba(240,192,64,0.5);
  }
  #info {
    font-size: 13px;
    color: #8899aa;
    margin-bottom: 10px;
  }
  canvas {
    border: 2px solid #333;
    border-radius: 4px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
  }
  #controls {
    margin-top: 10px;
    font-size: 12px;
    color: #667788;
  }
  kbd {
    background: #2a2a3e;
    border: 1px solid #444;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 11px;
    color: #aaccee;
  }
</style>
</head>
<body>
<h1>DeepSolo - 角色行走演示</h1>
<div id="info">WASD / 方向键移动 | 点击地图设定目标点</div>
<canvas id="game"></canvas>
<div id="controls">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或 <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> 移动 &nbsp;|&nbsp;
  <kbd>Shift</kbd> 加速跑
</div>

<script>
// ===== 游戏配置 =====
const TILE = 48;
const MAP_W = 40;
const MAP_H = 30;
const CANVAS_W = 960;
const CANVAS_H = 640;
const CHAR_SCALE = 1.6;

// ===== 精灵图配置 (LPC标准 4行 x 8列) =====
// Row 0: Up, Row 1: Left, Row 2: Down, Row 3: Right
const SPRITE_FRAME_W = 64;
const SPRITE_FRAME_H = 64;
const SPRITE_COLS = 8;
const SPRITE_DIRS = 4;
const ANIM_SPEED = 120; // ms per frame

const DIR_UP = 0;
const DIR_LEFT = 1;
const DIR_DOWN = 2;
const DIR_RIGHT = 3;

// ===== 地图生成 =====
// 0=草地, 1=深草, 2=土路, 3=水, 4=树, 5=花, 6=石头, 7=房子
const TILE_COLORS = {
  0: '#4a8c3f', // 草地
  1: '#3d7a34', // 深草
  2: '#c4a86b', // 土路
  3: '#3a7cbd', // 水
  4: '#2d5a1e', // 树干(深)
  5: '#4a8c3f', // 花(草地底)
  6: '#4a8c3f', // 石头(草地底)
  7: '#8b6914', // 房子
};

function generateMap() {
  const map = [];
  for (let y = 0; y < MAP_H; y++) {
    map[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      // 默认草地
      map[y][x] = 0;
    }
  }

  // 画几条土路
  for (let x = 0; x < MAP_W; x++) {
    map[15][x] = 2;
    map[14][x] = 2;
  }
  for (let y = 0; y < MAP_H; y++) {
    map[y][20] = 2;
    map[y][21] = 2;
  }

  // 水塘
  for (let dy = -2; dy <= 2; dy++) {
    for (let dx = -3; dx <= 3; dx++) {
      const dist = dx*dx/4 + dy*dy;
      if (dist <= 2) {
        const wy = 5 + dy;
        const wx = 8 + dx;
        if (wy >= 0 && wy < MAP_H && wx >= 0 && wx < MAP_W) {
          map[wy][wx] = 3;
        }
      }
    }
  }

  // 河流
  for (let y = 0; y < MAP_H; y++) {
    const rx = 32 + Math.floor(Math.sin(y * 0.4) * 2);
    for (let dx = -1; dx <= 1; dx++) {
      const wx = rx + dx;
      if (wx >= 0 && wx < MAP_W) map[y][wx] = 3;
    }
  }

  // 桥
  for (let dx = -1; dx <= 1; dx++) {
    map[15][32 + Math.floor(Math.sin(15 * 0.4) * 2) + dx] = 2;
  }

  // 树
  const treePositions = [
    [1,1],[2,1],[1,2],[3,1],[1,3],
    [35,2],[36,1],[37,1],[36,3],[38,2],
    [5,20],[6,20],[5,21],[7,22],[4,22],
    [25,25],[26,24],[27,25],[24,26],[28,24],
    [10,8],[11,8],[12,7],[10,10],[9,9],
    [30,10],[31,9],[32,10],[29,11],[33,9],
    [15,25],[16,26],[17,25],[14,27],
    [37,18],[38,19],[36,20],[38,17],
  ];
  for (const [tx, ty] of treePositions) {
    if (ty >= 0 && ty < MAP_H && tx >= 0 && tx < MAP_W && map[ty][tx] !== 3 && map[ty][tx] !== 2) {
      map[ty][tx] = 4;
    }
  }

  // 花丛
  const flowerPositions = [
    [3,5],[4,5],[5,4],[18,10],[19,10],[20,10],
    [12,18],[13,18],[14,19],[28,5],[29,6],[30,5],
    [6,12],[7,12],[8,13],[22,22],[23,22],[24,23],
  ];
  for (const [fx, fy] of flowerPositions) {
    if (fy >= 0 && fy < MAP_H && fx >= 0 && fx < MAP_W && map[fy][fx] === 0) {
      map[fy][fx] = 5;
    }
  }

  // 石头
  const stonePositions = [[10,5],[25,15],[35,25],[15,12],[30,20],[5,28]];
  for (const [sx, sy] of stonePositions) {
    if (sy >= 0 && sy < MAP_H && sx >= 0 && sx < MAP_W && map[sy][sx] === 0) {
      map[sy][sx] = 6;
    }
  }

  // 房子
  const housePositions = [
    [22,5],[23,5],[22,6],[23,6],
    [10,22],[11,22],[10,23],[11,23],
    [34,12],[35,12],[34,13],[35,13],
  ];
  for (const [hx, hy] of housePositions) {
    if (hy >= 0 && hy < MAP_H && hx >= 0 && hx < MAP_W && map[hy][hx] !== 3) {
      map[hy][hx] = 7;
    }
  }

  // 随机散布深草
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      if (map[y][x] === 0 && Math.random() < 0.15) {
        map[y][x] = 1;
      }
    }
  }

  return map;
}

// ===== Canvas初始化 =====
const canvas = document.getElementById('game');
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ===== 加载精灵图 =====
const spriteImg = new Image();
spriteImg.src = '/assets/char01-walk-4dir.png';
spriteImg.onload = () => {
  console.log('Sprite loaded:', spriteImg.width, spriteImg.height);
  requestAnimationFrame(gameLoop);
};

// ===== 地图生成 =====
const gameMap = generateMap();

// ===== 角色状态 =====
const player = {
  x: 20 * TILE + TILE / 2,
  y: 10 * TILE + TILE / 2,
  dir: DIR_DOWN,
  frame: 1,
  frameTimer: 0,
  speed: 2.5,
  moving: false,
  // 点击移动
  targetX: null,
  targetY: null,
};

// ===== 相机 =====
const camera = { x: 0, y: 0 };

// ===== 输入 =====
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  e.preventDefault();
});

// 点击移动
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX + camera.x;
  const my = (e.clientY - rect.top) * scaleY + camera.y;
  player.targetX = mx;
  player.targetY = my;
});

// ===== 碰撞检测 =====
function isBlocked(px, py) {
  const margin = 8;
  // 检测角色脚下3个点
  const points = [
    [px - margin, py + 4],
    [px + margin, py + 4],
    [px, py + margin + 4],
  ];
  for (const [cx, cy] of points) {
    const tx = Math.floor(cx / TILE);
    const ty = Math.floor(cy / TILE);
    if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return true;
    const tile = gameMap[ty][tx];
    if (tile === 3 || tile === 4 || tile === 6 || tile === 7) return true;
  }
  return false;
}

// ===== 更新 =====
function update(dt) {
  let dx = 0, dy = 0;

  // 键盘输入
  if (keys['KeyW'] || keys['ArrowUp']) { dy = -1; player.dir = DIR_UP; }
  if (keys['KeyS'] || keys['ArrowDown']) { dy = 1; player.dir = DIR_DOWN; }
  if (keys['KeyA'] || keys['ArrowLeft']) { dx = -1; player.dir = DIR_LEFT; }
  if (keys['KeyD'] || keys['ArrowRight']) { dx = 1; player.dir = DIR_RIGHT; }

  const keyboardMoving = dx !== 0 || dy !== 0;
  if (keyboardMoving) {
    // 键盘优先，取消点击目标
    player.targetX = null;
    player.targetY = null;
  }

  // 点击移动
  if (!keyboardMoving && player.targetX !== null) {
    const tdx = player.targetX - player.x;
    const tdy = player.targetY - player.y;
    const dist = Math.sqrt(tdx * tdx + tdy * tdy);
    if (dist > 4) {
      dx = tdx / dist;
      dy = tdy / dist;
      // 设定方向
      if (Math.abs(tdx) > Math.abs(tdy)) {
        player.dir = tdx > 0 ? DIR_RIGHT : DIR_LEFT;
      } else {
        player.dir = tdy > 0 ? DIR_DOWN : DIR_UP;
      }
    } else {
      player.targetX = null;
      player.targetY = null;
    }
  }

  player.moving = dx !== 0 || dy !== 0;

  if (player.moving) {
    const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
    const speed = sprint ? player.speed * 2 : player.speed;

    // 归一化对角线速度
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len > 0) {
      dx = (dx / len) * speed;
      dy = (dy / len) * speed;
    }

    // 尝试移动 (分轴碰撞)
    const newX = player.x + dx;
    const newY = player.y + dy;

    if (!isBlocked(newX, player.y)) {
      player.x = newX;
    }
    if (!isBlocked(player.x, newY)) {
      player.y = newY;
    }

    // 边界限制
    player.x = Math.max(TILE / 2, Math.min(MAP_W * TILE - TILE / 2, player.x));
    player.y = Math.max(TILE / 2, Math.min(MAP_H * TILE - TILE / 2, player.y));

    // 动画帧
    player.frameTimer += dt;
    if (player.frameTimer >= ANIM_SPEED) {
      player.frameTimer -= ANIM_SPEED;
      player.frame = (player.frame + 1) % SPRITE_COLS;
    }
  } else {
    player.frame = 1; // 站立帧
    player.frameTimer = 0;
  }

  // 更新相机 (角色居中)
  camera.x = player.x - CANVAS_W / 2;
  camera.y = player.y - CANVAS_H / 2;
  camera.x = Math.max(0, Math.min(MAP_W * TILE - CANVAS_W, camera.x));
  camera.y = Math.max(0, Math.min(MAP_H * TILE - CANVAS_H, camera.y));
}

// ===== 渲染 =====
function drawTile(x, y, type, screenX, screenY) {
  ctx.fillStyle = TILE_COLORS[type] || '#4a8c3f';
  ctx.fillRect(screenX, screenY, TILE, TILE);

  // 细节绘制
  switch (type) {
    case 1: // 深草 - 短草纹理
      ctx.fillStyle = '#357028';
      for (let i = 0; i < 3; i++) {
        const gx = screenX + 8 + i * 14 + ((x + y) % 3) * 2;
        const gy = screenY + 12 + i * 10;
        ctx.fillRect(gx, gy, 2, 6);
      }
      break;

    case 2: // 土路 - 纹理
      ctx.fillStyle = '#b89858';
      ctx.fillRect(screenX + 2, screenY + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = '#d4b87a';
      for (let i = 0; i < 3; i++) {
        const px = screenX + 5 + ((x * 7 + y * 3 + i) % 35);
        const py = screenY + 5 + ((x * 3 + y * 7 + i) % 35);
        ctx.fillRect(px, py, 3, 2);
      }
      break;

    case 3: // 水 - 波纹
      ctx.fillStyle = '#4a8cd8';
      ctx.fillRect(screenX + 1, screenY + 1, TILE - 2, TILE - 2);
      ctx.fillStyle = '#5a9ce8';
      const waveOff = (Date.now() / 500 + x * 0.5 + y * 0.3) % 1;
      for (let i = 0; i < 2; i++) {
        const wx = screenX + 8 + i * 18 + waveOff * 6;
        const wy = screenY + 14 + i * 12;
        ctx.fillRect(wx, wy, 12, 2);
      }
      break;

    case 4: // 树
      // 树干
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(screenX + 20, screenY + 28, 8, 16);
      // 树冠
      ctx.fillStyle = '#2d7a1e';
      ctx.beginPath();
      ctx.arc(screenX + 24, screenY + 22, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3a9028';
      ctx.beginPath();
      ctx.arc(screenX + 22, screenY + 18, 10, 0, Math.PI * 2);
      ctx.fill();
      break;

    case 5: // 花
      const flowerColors = ['#ff6b8a', '#ffb347', '#87ceeb', '#dda0dd', '#98fb98'];
      const fc = flowerColors[(x * 3 + y * 7) % flowerColors.length];
      ctx.fillStyle = fc;
      ctx.beginPath();
      ctx.arc(screenX + 20 + (x % 3) * 4, screenY + 20 + (y % 3) * 4, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff0';
      ctx.beginPath();
      ctx.arc(screenX + 20 + (x % 3) * 4, screenY + 20 + (y % 3) * 4, 1.5, 0, Math.PI * 2);
      ctx.fill();
      break;

    case 6: // 石头
      ctx.fillStyle = '#8a8a8a';
      ctx.beginPath();
      ctx.ellipse(screenX + 24, screenY + 30, 14, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#a0a0a0';
      ctx.beginPath();
      ctx.ellipse(screenX + 22, screenY + 28, 10, 7, -0.2, 0, Math.PI * 2);
      ctx.fill();
      break;

    case 7: // 房子
      ctx.fillStyle = '#8b6914';
      ctx.fillRect(screenX + 4, screenY + 16, TILE - 8, TILE - 20);
      // 屋顶
      ctx.fillStyle = '#cc3333';
      ctx.beginPath();
      ctx.moveTo(screenX + 2, screenY + 18);
      ctx.lineTo(screenX + TILE / 2, screenY + 4);
      ctx.lineTo(screenX + TILE - 2, screenY + 18);
      ctx.closePath();
      ctx.fill();
      // 门/窗
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(screenX + 18, screenY + 28, 12, 16);
      ctx.fillStyle = '#87ceeb';
      ctx.fillRect(screenX + 8, screenY + 22, 6, 6);
      break;
  }
}

function render() {
  // 清屏
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // 计算可见瓦片范围
  const startCol = Math.max(0, Math.floor(camera.x / TILE));
  const endCol = Math.min(MAP_W, Math.ceil((camera.x + CANVAS_W) / TILE) + 1);
  const startRow = Math.max(0, Math.floor(camera.y / TILE));
  const endRow = Math.min(MAP_H, Math.ceil((camera.y + CANVAS_H) / TILE) + 1);

  // 渲染地图
  for (let y = startRow; y < endRow; y++) {
    for (let x = startCol; x < endCol; x++) {
      const sx = x * TILE - camera.x;
      const sy = y * TILE - camera.y;
      drawTile(x, y, gameMap[y][x], sx, sy);
    }
  }

  // 绘制目标点标记
  if (player.targetX !== null) {
    const tx = player.targetX - camera.x;
    const ty = player.targetY - camera.y;
    ctx.save();
    ctx.strokeStyle = '#f0c040';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    const t = Date.now() / 300;
    const r = 6 + Math.sin(t) * 2;
    ctx.beginPath();
    ctx.arc(tx, ty, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    // 十字
    ctx.beginPath();
    ctx.moveTo(tx - 4, ty); ctx.lineTo(tx + 4, ty);
    ctx.moveTo(tx, ty - 4); ctx.lineTo(tx, ty + 4);
    ctx.stroke();
    ctx.restore();
  }

  // 绘制角色
  const drawX = player.x - camera.x;
  const drawY = player.y - camera.y;

  // 角色阴影
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(drawX, drawY + 18 * CHAR_SCALE, 14 * CHAR_SCALE, 5 * CHAR_SCALE, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 绘制精灵
  const srcX = player.frame * SPRITE_FRAME_W;
  const srcY = player.dir * SPRITE_FRAME_H;
  const drawW = SPRITE_FRAME_W * CHAR_SCALE;
  const drawH = SPRITE_FRAME_H * CHAR_SCALE;

  ctx.drawImage(
    spriteImg,
    srcX, srcY, SPRITE_FRAME_W, SPRITE_FRAME_H,
    drawX - drawW / 2, drawY - drawH + 8 * CHAR_SCALE,
    drawW, drawH
  );

  // HUD - 坐标
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(8, 8, 180, 28);
  ctx.fillStyle = '#f0c040';
  ctx.font = '13px Courier New';
  const tileX = Math.floor(player.x / TILE);
  const tileY = Math.floor(player.y / TILE);
  ctx.fillText(`Pos: (${tileX}, ${tileY})  Dir: ${['Up','Left','Down','Right'][player.dir]}`, 16, 26);

  // 小地图
  const mmW = 160, mmH = 120;
  const mmX = CANVAS_W - mmW - 10;
  const mmY = 10;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(mmX - 2, mmY - 2, mmW + 4, mmH + 4);
  ctx.strokeStyle = '#f0c040';
  ctx.lineWidth = 1;
  ctx.strokeRect(mmX - 2, mmY - 2, mmW + 4, mmH + 4);

  const mmScaleX = mmW / MAP_W;
  const mmScaleY = mmH / MAP_H;
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const t = gameMap[y][x];
      ctx.fillStyle = TILE_COLORS[t] || '#4a8c3f';
      ctx.fillRect(mmX + x * mmScaleX, mmY + y * mmScaleY, Math.ceil(mmScaleX), Math.ceil(mmScaleY));
    }
  }

  // 小地图上的角色位置
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.arc(mmX + (player.x / TILE) * mmScaleX, mmY + (player.y / TILE) * mmScaleY, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(mmX + (player.x / TILE) * mmScaleX, mmY + (player.y / TILE) * mmScaleY, 1.5, 0, Math.PI * 2);
  ctx.fill();
}

// ===== 游戏循环 =====
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = lastTime ? timestamp - lastTime : 16;
  lastTime = timestamp;

  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
